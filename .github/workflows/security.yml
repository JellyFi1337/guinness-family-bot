name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Prevent committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scan tracked files
        run: python scripts/check_secrets.py --mode tracked
