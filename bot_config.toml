# GUINNESS BOT — обычные, не секретные настройки.
# Этот файл можно хранить в Git.
# Discord identity (BOT_PROFILE, TOKEN_*, GUILD_ID_*, BOT_OWNER_ID,
# COMMAND_SYNC_FORCE, COMMAND_CLEAR_GLOBAL) — только в .env.
# Discord channel/role ID предпочтительнее имён: ID не ломаются при переименовании.
# Секции [channels], [categories], [roles], [access], [economy], [cooldowns]
# и [profile] можно переопределить на работающем боте (таблица runtime_settings).
# Живые ключи меняйте через /config, кроме restart_required (файл и перезапуск).
# DB_POOL_SIZE и пути требуют перезапуска. Секреты в runtime_settings не хранятся.

[profile]
# Контекст «проект — сервер — семья — сезон». От него зависят каталоги
# активностей, календарь, тексты, источник онлайна и включённые модули.
# Неизвестные игровые значения оставляйте пустыми: бот их не подставляет.
server_key = "memphis"
family_name = "Guinness"
family_tag = ""
direction = "unset"
timezone = "Europe/Moscow"
# Второй сезон рейтинга Majestic (сборка 4.2007.935). Даты настраиваются
# здесь, а не зашиваются в код: при объявлении следующего сезона меняется файл.
season_key = "season-2"
season_start = "2026-07-28"
season_end = "2026-10-27"
# Срок адаптации, удержание рекрутинга и политика фамилии — живые ключи
# /config группы onboarding (ONBOARDING_PROBATION_DAYS, ONBOARDING_RETENTION_DAYS,
# FAMILY_SURNAME_POLICY). 0 = не задано, сроки не выдумываются.
# Адаптер 9.1 есть: none / majestic_api / rage_master. Пока URL, версия,
# serverId, лимит и подпись в [external] пусты, majestic_api не стартует.
# none не ходит в master-list RAGE. Архивный rage_master включается
# профилем online_source и непустой строкой rage_server_query.
online_source = "none"
# Архивный RAGE master-list. Активный Memphis эти поля не использует.
# Устаревшие ключи мониторинга Milton ещё читаются с предупреждением в логе.
rage_master_url = "https://cdn.rage.mp/master/"
rage_server_query = ""
rage_server_name = ""
rage_master_enabled = true
presence_status_text = "{server}: {players} {players_word}"
presence_game_interval = 60
rage_request_timeout = 10
# Пустой список: шаблоны активностей и событий выключены, пока старший состав
# не подтвердит открытые улучшения. Неизвестный идентификатор — ошибка.
# Шаблоны /event читают этот список; вместимость капта — подтверждённые
# лимиты Majestic (20 / 35 / 50), не число кнопок Discord.
enabled_upgrades = []
# Базовый лимит состава Majestic источником не подтверждён. Улучшение
# «Участники организации» поднимает предел ступенями +10…+90 — ступени
# подключаются в 8.3, /members сейчас читает только это поле. Пустое значение
# значит «требует настройки»; не подставляйте 150 и другие допущения для нагрузки.
member_limit = ""
# Архивный профиль milton нельзя сделать активным без этого флага.
allow_archived = false
# Идентификатор Memphis в публичном API и рейтинге. Пусто — значение реестра (RU19).
external_server_id = ""

[profile.schedule]
# Подтверждённое расписание Memphis. Код только разбирает эти поля;
# пустое значение значит «требует настройки», время не выдумывается.
# Внутриигровые напоминания F2 за 3 ч / 1 ч / 10 мин / 1 мин бот не повторяет.
# Ключи живут в /config, группа calendar.
schedule_org_days = ["mon", "wed", "fri", "sat"]
schedule_rest_days = ["tue", "thu", "sun"]
schedule_air_cargo = ["00:00", "04:00", "08:00", "12:00", "16:00", "20:00"]
schedule_dealers = ["10:30", "18:30"]
schedule_workshops = ["14:30", "22:45"]
schedule_influence_window = "12:00-23:00"
schedule_hold_influence = "12:00"
schedule_lottery_days = ["mon", "wed", "fri", "sun"]
schedule_lottery_time = "18:00"
schedule_auction_days = ["tue", "thu", "sat"]
schedule_auction_time = "18:00"
# Срок метки склада после победы в вербовке дилеров — подтверждённое число wiki.
schedule_warehouse_tag_hours = 6

