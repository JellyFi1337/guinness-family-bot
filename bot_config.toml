[logging]
# Основной канал — stdout, его забирает journald. Файлы выключены, пока
# LOG_DIR пуст. На сервере указывайте /var/lib/guinnes-bot/logs: юнит может
# писать только туда (ProtectHome=read-only, ReadWritePaths=/var/lib/guinnes-bot).
# Не ставьте ./logs в корне проекта — при старте это PermissionError.
LOG_DIR = ""
# text — key=value в одну строку; json — одна JSON-запись на строку.
LOG_FORMAT = "text"
LOG_LEVEL = "INFO"
# Имя=уровень через запятую. discord.gateway и discord.client всегда не ниже WARNING.
LOG_LOGGER_LEVELS = "discord.gateway=WARNING,discord.client=WARNING"

